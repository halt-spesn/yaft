name: ARM Static Build

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  workflow_dispatch:

jobs:
  build-arm-static:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install ARM cross-compilation toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf
    
    - name: Build mkfont_bdf tool with native compiler
      run: |
        export LANG=en_US.UTF-8
        make mkfont_bdf
    
    - name: Generate glyph.h
      run: |
        export LANG=en_US.UTF-8
        make glyph.h
    
    - name: Build yaft statically for ARM
      run: |
        export LANG=en_US.UTF-8
        make yaft CC=arm-linux-gnueabihf-gcc CFLAGS="-std=c99 -pedantic -Wall -Wextra -O3 -pipe" LDFLAGS="-static"
    
    - name: Verify static binary
      run: |
        file yaft
        arm-linux-gnueabihf-readelf -d yaft || echo "Static binary (no dynamic section expected)"
    
    - name: Upload ARM static binary
      uses: actions/upload-artifact@v4
      with:
        name: yaft-armv7-static
        path: yaft
        if-no-files-found: error
